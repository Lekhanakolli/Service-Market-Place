{% extends 'base.html' %}
{% block title %}Forgot Password – Service Marketplace{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-right auth-centered">
        <div class="auth-card">
            <h2 class="auth-title">Reset Your Password</h2>
            <p class="auth-sub">Enter your email and account type to receive a reset link.</p>

            <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
                <div class="role-tabs">
                    <label class="role-tab active">
                        <input type="radio" name="role" value="user" checked hidden onchange="setResetRole(this)">
                        <span class="role-tab-icon">👤</span> Customer
                    </label>
                    <label class="role-tab">
                        <input type="radio" name="role" value="worker" hidden onchange="setResetRole(this)">
                        <span class="role-tab-icon">🔧</span> Worker
                    </label>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <button type="submit" class="btn-auth">Send Reset Link →</button>
            </form>

            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p>
        </div>
    </div>
</div>
<script>
function setResetRole(input) {
    document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
    input.parentElement.classList.add('active');
}
</script>
{% endblock %}
