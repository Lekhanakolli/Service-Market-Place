{% extends 'base.html' %}
{% block title %}Create New Password – Service Marketplace{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-right auth-centered">
        <div class="auth-card">
            <h2 class="auth-title">Create New Password</h2>
            <p class="auth-sub">Choose a new password for your account.</p>
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" required minlength="6" placeholder="Re-enter your password">
                </div>
                <button type="submit" class="btn-auth">Update Password →</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
